<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact – Luvan Interior Lighting Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="contact.css">
</head>
<body>
  <!-- SECTION 2: CONTACT DETAILS + FORM -->


<section class="contact" aria-label="Contact details">
  <div class="wrap contact-grid">

    <div class="details">
      <div>
        <h2>We'd love to hear about your project</h2>
        <p class="lead">Have questions? Reach out to our team for expert advice and personalized recommendations.</p>
      </div>
      <div class="hours">
        <h3>Working hours</h3>
        <ul>
          <li><span>Monday — Friday</span><span>8:00 AM — 6:00 PM</span></li>
          <li><span>Saturday</span><span>9:00 AM — 3:00 PM</span></li>
        </ul>
      </div>
    </div>

    <div class="form-card">
      <h3>Request your consultation</h3>
      <form action="#" method="get">
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required>
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" name="phone" placeholder="+1 000 000 0000">
        </div>
        <div class="field">
          <label for="service">Service</label>
          <select id="service" name="service">
            <option>Residential lighting</option>
            <option>Commercial lighting</option>
            <option>Hospitality lighting</option>
            <option>Daylight design</option>
            <option>Lighting consultation</option>
          </select>
        </div>
        <div class="field full">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Tell us about your project" required></textarea>
        </div>
        <button type="submit" class="btn">
          Request a Consultation
          <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </button>
      </form>
    </div>

  </div>
</section>
</body>
</html>
